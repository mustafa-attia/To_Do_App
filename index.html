<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>

    <link rel="stylesheet" href="./style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="to-do-container py-5">
        <h2 class="text-center fw-bolder pb-4">Tasks Manager</h2>

        <div class="add-task">
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="floatingText"
              placeholder="Add Task here"
            />
            <label for="floatingText">Add your Task</label>
          </div>
          <div class="add-btn-box">
            <button class="add_btn"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
        <div class="task-stats">
          <div class="stat-card active">
            <div class="stat-title">Active Tasks</div>
            <div class="stat-number tasks-counter">0</div>
          </div>

          <div class="stat-card completed">
            <div class="stat-title">Completed Tasks</div>
            <div class="stat-number completed-counter">0</div>
          </div>
        </div>

          <div class="tasks-box">
            <div class="tasks-header">
              <h4><i class="fa-solid fa-list-check"></i> Tasks</h4>

              <span class="tasks-count">
                <span class="tasks-counter">0</span> Tasks
              </span>
            </div>

            <div class="tasks-container">

            </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./main.js"></script>
  </body>
</html>
